{% extends "base.html" %}

{% block page_styles %}
<link rel="stylesheet" href="/static/css/home.css">
{% endblock %}

{% block body_class %}home-page{% endblock %}

{% block content %}
<main class="home-shell">
    <span class="sky-star star-gold star-one" aria-hidden="true">✦</span>
    <span class="sky-star star-blue star-two" aria-hidden="true">✦</span>
    <span class="sky-star star-gold star-three" aria-hidden="true">✦</span>
    <span class="sky-star star-violet star-four" aria-hidden="true">✦</span>

    <section class="home-card" aria-labelledby="home-title">
        <header class="home-header">
            <img class="star-mascot" src="/static/images/star-mascot.png" alt="Maskot bintang ceria">
            <h1 id="home-title">Pilih akun dulu</h1>
            <p>Siapa yang mau latihan hari ini?</p>
        </header>

        <div class="profile-buttons" aria-label="Pilih akun anak">
            <a class="profile-card profile-card-blue" href="/home/althafandra">
                <span class="profile-avatar avatar-blue"><img src="/static/images/althafandra-avatar.png" alt="Althafandra"></span>
                <span class="profile-name">Althafandra</span>
                <span class="continue-button">Lanjutkan <b aria-hidden="true">›</b></span>
            </a>
            <a class="profile-card profile-card-purple" href="/home/alleia">
                <span class="profile-avatar avatar-purple"><img src="/static/images/alleia-avatar.png" alt="Alleia"></span>
                <span class="profile-name">Alleia</span>
                <span class="continue-button">Lanjutkan <b aria-hidden="true">›</b></span>
            </a>
        </div>

        <a class="stats-link" href="/stats"><img class="stats-link-icon" src="/static/images/statistics-chart-icon.svg" alt="" aria-hidden="true"> Lihat Statistik</a>
    </section>
</main>
{% endblock %}
